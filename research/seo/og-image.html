<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#fff;color:#111318;font-family:"Liberation Sans Narrow","Arial Narrow",Arial,sans-serif;position:relative;overflow:hidden}
  .frame{position:absolute;inset:24px;border:6px solid #111318;padding:44px 56px;display:flex;flex-direction:column}
  .brand{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:26px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;border-bottom:3px solid #111318;padding-bottom:18px;display:flex;justify-content:space-between}
  .brand span:last-child{color:#565b66;font-weight:400;letter-spacing:.08em}
  h1{font-size:126px;line-height:.98;font-weight:700;letter-spacing:-.01em;margin-top:38px}
  p{font-family:Arial,Helvetica,sans-serif;font-size:27px;line-height:1.35;color:#3a3f4a;margin-top:22px;max-width:1040px}
  .row{margin-top:auto;display:flex;gap:0;border:3px solid #111318}
  .cell{flex:1;padding:14px 10px;text-align:center;font-family:"DejaVu Sans Mono",monospace;font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase}
  .cell+.cell{border-left:3px solid #111318}
  .g{background:#e6f4ea;color:#1e7a34}.t{background:#e2eef4;color:#12586f}.r{background:#fce8e6;color:#b3261e}.a{background:#fef3e2;color:#92600a}
</style></head><body><div class="frame">
  <div class="brand"><span>PolicyPeek</span><span>getpolicypeek.com</span></div>
  <h1>Does it train<br>on your data?</h1>
  <p>Plain-English verdicts, sourced from each AI tool's own privacy policy.</p>
  <div class="row"><div class="cell g">Compliant</div><div class="cell t">With caveats</div><div class="cell r">Not compliant</div><div class="cell a">Unrated</div></div>
</div></body></html>
